<g class="in" style="animation-delay:0.30s"><g transform="translate(24 115) scale(0.75)" fill="none" stroke="#f6c177" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></g><text x="54" y="130" fill="#a8c8f5" font-size="14">issues</text><text x="400" y="130" fill="#f4e6d8" font-size="15" font-weight="700" text-anchor="end">3</text></g>
