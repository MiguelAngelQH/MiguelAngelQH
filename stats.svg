<g class="in" style="animation-delay:0.60s"><g transform="translate(24 175) scale(0.75)" fill="none" stroke="#f6c177" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></g><text x="54" y="190" fill="#a8c8f5" font-size="14">estrellas</text><text x="400" y="190" fill="#f4e6d8" font-size="15" font-weight="700" text-anchor="end">0</text></g>
