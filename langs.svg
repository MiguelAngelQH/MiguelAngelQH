<clipPath id="c"><rect x="1" y="1" width="422" height="268" rx="14"/></clipPath>
</defs>
<style>text{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Menlo,Consolas,'Courier New',monospace}
