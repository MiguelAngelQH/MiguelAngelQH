<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="900" height="64" role="img" aria-label="proyectos">
<defs>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#2a3b60"/><stop offset=".45" stop-color="#2a3b60"/><stop offset=".5" stop-color="#f2a7c3"/><stop offset=".55" stop-color="#2a3b60"/><stop offset="1" stop-color="#2a3b60"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="3.5s" repeatCount="indefinite"/></linearGradient>
</defs>
<style>
text{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Menlo,Consolas,'Courier New',monospace}
.cur{animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.box{animation:p 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes p{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
.sp{animation:sp 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sp{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.t{animation:t 1.6s steps(12) both}
@keyframes t{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
</style>
