.plane{animation:plane 45s linear infinite}
@keyframes plane{from{transform:translateX(0)}to{transform:translateX(-1400px)}}
.bl{animation:bl 1.2s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.neon{animation:neon 5s infinite}
@keyframes neon{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.25}50%{opacity:1}52%{opacity:.4}53%{opacity:1}}

</style>
