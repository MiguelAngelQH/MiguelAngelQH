<style>text{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Menlo,Consolas,'Courier New',monospace}
.ic{animation:f 4s ease-in-out infinite}@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.1}50%{opacity:.9}}

.ff{animation:ff 7s ease-in-out infinite}
@keyframes ff{0%{opacity:0;transform:translate(0,0)}30%{opacity:.9}70%{opacity:.6}100%{opacity:0;transform:translate(14px,-40px)}}
.shoot{animation:shoot 9s ease-in infinite;opacity:0}
@keyframes shoot{0%{opacity:0;transform:translate(0,0)}2%{opacity:1}9%{opacity:0;transform:translate(320px,120px)}100%{opacity:0;transform:translate(320px,120px)}}
.plane{animation:plane 45s linear infinite}
@keyframes plane{from{transform:translateX(0)}to{transform:translateX(-1400px)}}
.bl{animation:bl 1.2s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.neon{animation:neon 5s infinite}
@keyframes neon{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.25}50%{opacity:1}52%{opacity:.4}53%{opacity:1}}

</style>
